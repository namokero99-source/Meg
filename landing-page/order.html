<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สั่งซื้อ — ชั้นหนังสือ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html">ชั้น<span>หนังสือ</span></a>
    <div class="nav-links">
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">หนังสือทั้งหมด</a>
    </div>
  </div>
</nav>

<div class="ledger">
  <h1>ยืนยันการสั่งซื้อ</h1>
  <p class="sub">กรอกข้อมูลให้ครบ แอดมินจะติดต่อกลับเพื่อนัดโอนเงินและจัดส่ง</p>

  <form id="orderForm">
    <div class="field">
      <label for="customerName">ชื่อผู้สั่งซื้อ</label>
      <input type="text" id="customerName" required>
    </div>
    <div class="field">
      <label for="contact">เบอร์โทร หรือ Line ID</label>
      <input type="text" id="contact" required>
    </div>
    <div class="field">
      <label for="items">รายการหนังสือ</label>
      <textarea id="items" required></textarea>
    </div>
    <div class="field">
      <label for="note">หมายเหตุ (ที่อยู่จัดส่ง / อื่นๆ)</label>
      <textarea id="note"></textarea>
    </div>

    <div class="total-row">
      <span>ยอดรวม</span>
      <span>฿<input type="text" id="total" style="width:80px;text-align:right;border:none;font-family:var(--serif);font-size:1.4rem;padding:0;" required></span>
    </div>

    <button type="submit" class="btn solid">ยืนยันสั่งซื้อ</button>
    <p id="formMsg" class="form-msg"></p>
  </form>
</div>

<footer>
  <div class="wrap">© ชั้นหนังสือ · <a href="admin.html">แอดมิน</a></div>
</footer>

<script src="script.js"></script>
</body>
</html>
